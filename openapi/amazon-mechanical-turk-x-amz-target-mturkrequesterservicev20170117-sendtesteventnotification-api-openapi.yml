tags:
- name: '#X Amz Target=MTurkRequesterServiceV20170117.SendTestEventNotification'
paths:
  /#X-Amz-Target=MTurkRequesterServiceV20170117.SendTestEventNotification:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: SendTestEventNotification
      description: ' The <code>SendTestEventNotification</code> operation causes Amazon Mechanical Turk to send a notification message as if a HIT event occurred, according to the provided notification specification. This allows you to test notifications without setting up notifications for a real HIT type and trying to trigger them using the website. When you call this operation, the service attempts to send the test notification immediately. '
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendTestEventNotificationResponse'
        '480':
          description: ServiceFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceFault'
        '481':
          description: RequestError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTestEventNotificationRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - MTurkRequesterServiceV20170117.SendTestEventNotification
      summary: Amazon Mechanical Turk Send Test Event Notification
      tags:
      - '#X Amz Target=MTurkRequesterServiceV20170117.SendTestEventNotification'
components:
  schemas:
    SendTestEventNotificationRequest:
      type: object
      required:
      - Notification
      - TestEventType
      title: SendTestEventNotificationRequest
      properties:
        Notification:
          allOf:
          - $ref: '#/components/schemas/NotificationSpecification'
          - description: ' The notification specification to test. This value is identical to the value you would provide to the UpdateNotificationSettings operation when you establish the notification specification for a HIT type. '
        TestEventType:
          allOf:
          - $ref: '#/components/schemas/EventType'
          - description: ' The event to simulate to test the notification specification. This event is included in the test message even if the notification specification does not include the event type. The notification specification does not filter out the test event. '
    ServiceFault: {}
    RequestError: {}
    EventType:
      type: string
      enum:
      - AssignmentAccepted
      - AssignmentAbandoned
      - AssignmentReturned
      - AssignmentSubmitted
      - AssignmentRejected
      - AssignmentApproved
      - HITCreated
      - HITExpired
      - HITReviewable
      - HITExtended
      - HITDisposed
      - Ping
    NotificationSpecification:
      type: object
      required:
      - Destination
      - Transport
      - Version
      - EventTypes
      properties:
        Destination:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: '<p> The target for notification messages. The Destination’s format is determined by the specified Transport: </p> <ul> <li> <p>When Transport is Email, the Destination is your email address.</p> </li> <li> <p>When Transport is SQS, the Destination is your queue URL.</p> </li> <li> <p>When Transport is SNS, the Destination is the ARN of your topic.</p> </li> </ul>'
        Transport:
          allOf:
          - $ref: '#/components/schemas/NotificationTransport'
          - description: ' The method Amazon Mechanical Turk uses to send the notification. Valid Values: Email | SQS | SNS. '
        Version:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The version of the Notification API to use. Valid value is 2006-05-05.
        EventTypes:
          allOf:
          - $ref: '#/components/schemas/EventTypeList'
          - description: ' The list of events that should cause notifications to be sent. Valid Values: AssignmentAccepted | AssignmentAbandoned | AssignmentReturned | AssignmentSubmitted | AssignmentRejected | AssignmentApproved | HITCreated | HITExtended | HITDisposed | HITReviewable | HITExpired | Ping. The Ping event is only valid for the SendTestEventNotification operation. '
      description: The NotificationSpecification data structure describes a HIT event notification for a HIT type.
    String:
      type: string
    NotificationTransport:
      type: string
      enum:
      - Email
      - SQS
      - SNS
    EventTypeList:
      type: array
      items:
        $ref: '#/components/schemas/EventType'
    SendTestEventNotificationResponse:
      type: object
      properties: {}
