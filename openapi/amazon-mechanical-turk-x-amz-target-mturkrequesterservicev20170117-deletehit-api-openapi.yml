        in: header
        required: true
        schema:
          type: string
          enum:
          - MTurkRequesterServiceV20170117.DeleteHIT
      summary: Amazon Mechanical Turk Delete H I T
      tags:
      - '#X Amz Target=MTurkRequesterServiceV20170117.DeleteHIT'
