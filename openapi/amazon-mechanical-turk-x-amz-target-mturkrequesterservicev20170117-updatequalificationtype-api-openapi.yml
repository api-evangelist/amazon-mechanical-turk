paths:
  /#X-Amz-Target=MTurkRequesterServiceV20170117.UpdateQualificationType:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: UpdateQualificationType
      description: <p> The <code>UpdateQualificationType</code> operation modifies the attributes of an existing Qualification type, which is represented by a QualificationType data structure. Only the owner of a Qualification type can modify its attributes. </p> <p> Most attributes of a Qualification type can be changed after the type has been created. However, the Name and Keywords fields cannot be modified. The RetryDelayInSeconds parameter can be modified or added to change the delay or to enable retries, but RetryDelayInSeconds cannot be used to disable retries. </p> <p> You can use this operation to update the test for a Qualification type. The test is updated based on the values specified for the Test, TestDurationInSeconds and AnswerKey parameters. All three parameters specify the updated test. If you are updating the test for a type, you must specify the Test and TestDurationInSeconds parameters. The AnswerKey parameter is optional; omitting it specifies that the updated test does not have an answer key. </p> <p> If you omit the Test parameter, the test for the Qualification type is unchanged. There is no way to remove a test from a Qualification type that has one. If the type already has a test, you cannot update it to be AutoGranted. If the Qualification type does not have a test and one is provided by an update, the type will henceforth have a test. </p> <p> If you want to update the test duration or answer key for an existing test without changing the questions, you must specify a Test parameter with the original questions, along with the updated values. </p> <p> If you provide an updated Test but no AnswerKey, the new test will not have an answer key. Requests for such Qualifications must be granted manually. </p> <p> You can also update the AutoGranted and AutoGrantedValue attributes of the Qualification type.</p>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateQualificationTypeResponse'
        '480':
          description: ServiceFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceFault'
        '481':
          description: RequestError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQualificationTypeRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - MTurkRequesterServiceV20170117.UpdateQualificationType
      summary: Amazon Mechanical Turk Update Qualification Type
      tags:
      - '#X Amz Target=MTurkRequesterServiceV20170117.UpdateQualificationType'
components:
  schemas:
    Long:
      type: integer
    UpdateQualificationTypeResponse:
      type: object
      properties:
        QualificationType:
          allOf:
          - $ref: '#/components/schemas/QualificationType'
          - description: ' Contains a QualificationType data structure.'
    RequestError: {}
    Boolean:
      type: boolean
    ServiceFault: {}
    EntityId:
      type: string
      pattern: ^[A-Z0-9]+$
      minLength: 1
      maxLength: 64
    String:
      type: string
    QualificationTypeStatus:
      type: string
      enum:
      - Active
      - Inactive
    UpdateQualificationTypeRequest:
      type: object
      required:
      - QualificationTypeId
      title: UpdateQualificationTypeRequest
      properties:
        QualificationTypeId:
          allOf:
          - $ref: '#/components/schemas/EntityId'
          - description: The ID of the Qualification type to update.
        Description:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The new description of the Qualification type.
        QualificationTypeStatus:
          allOf:
          - $ref: '#/components/schemas/QualificationTypeStatus'
          - description: The new status of the Qualification type - Active | Inactive
        Test:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: '<p>The questions for the Qualification test a Worker must answer correctly to obtain a Qualification of this type. If this parameter is specified, <code>TestDurationInSeconds</code> must also be specified.</p> <p>Constraints: Must not be longer than 65535 bytes. Must be a QuestionForm data structure. This parameter cannot be specified if AutoGranted is true.</p> <p>Constraints: None. If not specified, the Worker may request the Qualification without answering any questions.</p>'
        AnswerKey:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The answers to the Qualification test specified in the Test parameter, in the form of an AnswerKey data structure.
        TestDurationInSeconds:
          allOf:
          - $ref: '#/components/schemas/Long'
          - description: The number of seconds the Worker has to complete the Qualification test, starting from the time the Worker requests the Qualification.
        RetryDelayInSeconds:
          allOf:
          - $ref: '#/components/schemas/Long'
          - description: The amount of time, in seconds, that Workers must wait after requesting a Qualification of the specified Qualification type before they can retry the Qualification request. It is not possible to disable retries for a Qualification type after it has been created with retries enabled. If you want to disable retries, you must dispose of the existing retry-enabled Qualification type using DisposeQualificationType and then create a new Qualification type with retries disabled using CreateQualificationType.
        AutoGranted:
          allOf:
          - $ref: '#/components/schemas/Boolean'
          - description: '<p>Specifies whether requests for the Qualification type are granted immediately, without prompting the Worker with a Qualification test.</p> <p>Constraints: If the Test parameter is specified, this parameter cannot be true.</p>'
        AutoGrantedValue:
          allOf:
          - $ref: '#/components/schemas/Integer'
          - description: The Qualification value to use for automatically granted Qualifications. This parameter is used only if the AutoGranted parameter is true.
    Timestamp:
      type: string
      format: date-time
    Integer:
      type: integer
    QualificationType:
      type: object
      properties:
        QualificationTypeId:
          allOf:
          - $ref: '#/components/schemas/EntityId'
          - description: ' A unique identifier for the Qualification type. A Qualification type is given a Qualification type ID when you call the CreateQualificationType operation. '
        CreationTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: ' The date and time the Qualification type was created. '
        Name:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: ' The name of the Qualification type. The type name is used to identify the type, and to find the type using a Qualification type search. '
        Description:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: ' A long description for the Qualification type. '
        Keywords:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: ' One or more words or phrases that describe theQualification type, separated by commas. The Keywords make the type easier to find using a search. '
        QualificationTypeStatus:
          allOf:
          - $ref: '#/components/schemas/QualificationTypeStatus'
          - description: ' The status of the Qualification type. A Qualification type''s status determines if users can apply to receive a Qualification of this type, and if HITs can be created with requirements based on this type. Valid values are Active | Inactive. '
        Test:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: ' The questions for a Qualification test associated with this Qualification type that a user can take to obtain a Qualification of this type. This parameter must be specified if AnswerKey is present. A Qualification type cannot have both a specified Test parameter and an AutoGranted value of true. '
        TestDurationInSeconds:
          allOf:
          - $ref: '#/components/schemas/Long'
          - description: ' The amount of time, in seconds, given to a Worker to complete the Qualification test, beginning from the time the Worker requests the Qualification. '
        AnswerKey:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The answers to the Qualification test specified in the Test parameter.
        RetryDelayInSeconds:
          allOf:
          - $ref: '#/components/schemas/Long'
          - description: ' The amount of time, in seconds, Workers must wait after taking the Qualification test before they can take it again. Workers can take a Qualification test multiple times if they were not granted the Qualification from a previous attempt, or if the test offers a gradient score and they want a better score. If not specified, retries are disabled and Workers can request a Qualification only once. '
        IsRequestable:
          allOf:
          - $ref: '#/components/schemas/Boolean'
          - description: ' Specifies whether the Qualification type is one that a user can request through the Amazon Mechanical Turk web site, such as by taking a Qualification test. This value is False for Qualifications assigned automatically by the system. Valid values are True | False. '
        AutoGranted:
          allOf:
          - $ref: '#/components/schemas/Boolean'
          - description: Specifies that requests for the Qualification type are granted immediately, without prompting the Worker with a Qualification test. Valid values are True | False.
        AutoGrantedValue:
          allOf:
          - $ref: '#/components/schemas/Integer'
          - description: ' The Qualification integer value to use for automatically granted Qualifications, if AutoGranted is true. This is 1 by default. '
      description: ' The QualificationType data structure represents a Qualification type, a description of a property of a Worker that must match the requirements of a HIT for the Worker to be able to accept the HIT. The type also describes how a Worker can obtain a Qualification of that type, such as through a Qualification test. '
