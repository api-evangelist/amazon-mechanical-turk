paths:
  /#X-Amz-Target=MTurkRequesterServiceV20170117.UpdateNotificationSettings:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: UpdateNotificationSettings
      description: ' The <code>UpdateNotificationSettings</code> operation creates, updates, disables or re-enables notifications for a HIT type. If you call the UpdateNotificationSettings operation for a HIT type that already has a notification specification, the operation replaces the old specification with a new one. You can call the UpdateNotificationSettings operation to enable or disable notifications for the HIT type, without having to modify the notification specification itself by providing updates to the Active status without specifying a new notification specification. To change the Active status of a HIT type''s notifications, the HIT type must already have a notification specification, or one must be provided in the same call to <code>UpdateNotificationSettings</code>. '
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateNotificationSettingsResponse'
        '480':
          description: ServiceFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceFault'
        '481':
          description: RequestError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationSettingsRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - MTurkRequesterServiceV20170117.UpdateNotificationSettings
      summary: Amazon Mechanical Turk Update Notification Settings
      tags:
      - '#X Amz Target=MTurkRequesterServiceV20170117.UpdateNotificationSettings'
components:
  schemas:
    ServiceFault: {}
    EntityId:
      type: string
      pattern: ^[A-Z0-9]+$
      minLength: 1
      maxLength: 64
    RequestError: {}
    EventType:
      type: string
      enum:
      - AssignmentAccepted
      - AssignmentAbandoned
      - AssignmentReturned
      - AssignmentSubmitted
      - AssignmentRejected
      - AssignmentApproved
      - HITCreated
      - HITExpired
      - HITReviewable
      - HITExtended
      - HITDisposed
      - Ping
    NotificationSpecification:
      type: object
      required:
      - Destination
      - Transport
      - Version
      - EventTypes
      properties:
        Destination:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: '<p> The target for notification messages. The Destination’s format is determined by the specified Transport: </p> <ul> <li> <p>When Transport is Email, the Destination is your email address.</p> </li> <li> <p>When Transport is SQS, the Destination is your queue URL.</p> </li> <li> <p>When Transport is SNS, the Destination is the ARN of your topic.</p> </li> </ul>'
        Transport:
          allOf:
          - $ref: '#/components/schemas/NotificationTransport'
          - description: ' The method Amazon Mechanical Turk uses to send the notification. Valid Values: Email | SQS | SNS. '
        Version:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The version of the Notification API to use. Valid value is 2006-05-05.
        EventTypes:
          allOf:
          - $ref: '#/components/schemas/EventTypeList'
          - description: ' The list of events that should cause notifications to be sent. Valid Values: AssignmentAccepted | AssignmentAbandoned | AssignmentReturned | AssignmentSubmitted | AssignmentRejected | AssignmentApproved | HITCreated | HITExtended | HITDisposed | HITReviewable | HITExpired | Ping. The Ping event is only valid for the SendTestEventNotification operation. '
      description: The NotificationSpecification data structure describes a HIT event notification for a HIT type.
    String:
      type: string
    UpdateNotificationSettingsRequest:
      type: object
      required:
      - HITTypeId
      title: UpdateNotificationSettingsRequest
      properties:
        HITTypeId:
          allOf:
          - $ref: '#/components/schemas/EntityId'
          - description: ' The ID of the HIT type whose notification specification is being updated. '
        Notification:
          allOf:
          - $ref: '#/components/schemas/NotificationSpecification'
          - description: ' The notification specification for the HIT type. '
        Active:
          allOf:
          - $ref: '#/components/schemas/Boolean'
          - description: ' Specifies whether notifications are sent for HITs of this HIT type, according to the notification specification. You must specify either the Notification parameter or the Active parameter for the call to UpdateNotificationSettings to succeed. '
    NotificationTransport:
      type: string
      enum:
      - Email
      - SQS
      - SNS
    EventTypeList:
      type: array
      items:
        $ref: '#/components/schemas/EventType'
    Boolean:
      type: boolean
    UpdateNotificationSettingsResponse:
      type: object
      properties: {}
